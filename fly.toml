app = "jem-brain-mcp"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  TRANSPORT = "http"
  HOST = "0.0.0.0"
  PORT = "8080"
  MCP_OAUTH_PUBLIC_BASE = "https://jem-brain-mcp.fly.dev"
  MCP_OAUTH_DOCUMENTATION_URL = "https://github.com/JEM-Fizbit/brain-mcp-server"
  MCP_OAUTH_REFRESH_REUSE_GRACE_SEC = "15"
  BRAIN_IDENTITY_PROVIDERS = "github"
  BRAIN_IDENTITY_DEFAULT_PROVIDER = "github"
  GITHUB_OAUTH_CALLBACK_PATH = "/authorize/github/callback"
  BRAIN_GITHUB_ALLOWED_FALLBACK = "1"
  BRAIN_ID = "ai-brain-jem"
  BRAIN_PLATFORM_CONFIG = "/app/config/brain-platform.john-ers-pilot.json"
  BRAIN_PLATFORM_STATE_ROOT = "/data/state"
  BRAIN_OAUTH_STATE_STORE = "postgres"
  BRAIN_REVISION_STORE = "postgres"
  BRAIN_ARTIFACT_STORE = "supabase"
  BRAIN_ARTIFACT_BYTE_ACCESS = "metadata_only"
  BRAIN_SUPABASE_STORAGE_BUCKET = "brain-artifacts"
  # Spec 019 phase 3, set from a 4-arm A/B on the live deployment. Keeping a
  # pooled connection past the 10s default is the whole effect: at a ~26s gap,
  # idle=10s reused 0/6 across two keepalive settings, idle=120s reused 6/6 and
  # cut handler latency from ~60ms to ~20ms. pg-pool "min" made no measurable
  # difference either way and is deliberately not set. Remove this line to
  # revert to the 10s default.
  BRAIN_PG_IDLE_TIMEOUT_MS = "120000"
  BRAIN_HTTP_TIMING_LOGS = "1"
  BRAIN_DATE_TIME_ZONE = "Asia/Ho_Chi_Minh"
  BRAIN_SLACK_ALERT_CHANNEL = "C0B27NK40H4"
  BRAIN_SLACK_ALERT_DM = "U06SWS92Y5V"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
