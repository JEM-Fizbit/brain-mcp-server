app = "jem-brain-mcp"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  TRANSPORT = "http"
  HOST = "0.0.0.0"
  PORT = "8080"
  MCP_OAUTH_PUBLIC_BASE = "https://jem-brain-mcp.fly.dev"
  GITHUB_OAUTH_CALLBACK_PATH = "/authorize/github/callback"
  BRAIN_ID = "ai-brain-jem"
  BRAIN_PLATFORM_CONFIG = "/data/config/registry.json"
  BRAIN_PLATFORM_STATE_ROOT = "/data/state"
  BRAIN_REVISION_STORE = "postgres"
  BRAIN_ARTIFACT_STORE = "supabase"
  BRAIN_ARTIFACT_BYTE_ACCESS = "metadata_only"
  BRAIN_SUPABASE_STORAGE_BUCKET = "brain-artifacts"
  BRAIN_HTTP_TIMING_LOGS = "1"
  BRAIN_DATE_TIME_ZONE = "Asia/Ho_Chi_Minh"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
