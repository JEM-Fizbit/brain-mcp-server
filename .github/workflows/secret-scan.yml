# Secret scan for cloud agents and CI, which never run this Mac's global git hooks.
# Copy to .github/workflows/secret-scan.yml. Uses the repo's .gitleaks.toml when present
# (it must extend the default rules), else gitleaks' built-in rules.
# Source: ~/Projects/ai-knowledge/templates/github/secret-scan.yml
# Protocol: ~/Projects/ai-knowledge/protocols/SECRET_HANDLING.md
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$GITHUB_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then range="$BEFORE..$GITHUB_SHA"
          else range="-1 $GITHUB_SHA"; fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$range" --redact --no-banner --exit-code 1
